# build -- compile this repository's programs against the toolchain it pins.
#
# The toolchain is resolved as a dependency edge -- `sh mk/deps-fetch.sh
# toolchain', which is what DEPS is read by -- and the shape it resolved to is
# read back with `sh mk/deps.sh -k toolchain'; C900_TOOLCHAIN then points at
# the deps/ path that placed, rather than a separate checkout of it.
#
# The kernel is an edge too, and the sweep needs it: the userland owns no
# machine layer, so <sys/machz8001.h> and the rest of that header set are the
# kernel repository's, and build-hyacc.sh -- step 1 of the sweep -- refuses by
# name without them.  It is checked out here and named in C900_KERNEL, set
# rather than searched, because a job that depended on directory adjacency
# breaks the first time a runner image moves its checkouts.
#
# This repository builds programs; it does not link a kernel and does not pack
# an image (those are commodore-900-coh-kernel3 and commodore-900-dist).
# The gate here is `make -C hostbuild userland' -- the cmd/games/libs sweep --
# followed by `publish' and `check-publish-fresh', so a green run proves the
# same thing a human running `make -C hostbuild all' by hand would check: that
# the sweep finished AND that publish ran after it, not against a stale
# build/.ulstamp.
#
# NOT included, on purpose:
#   * tests/check-paths.sh.  Only the toolchain repository is checked out
#     natively on Windows; this repository builds under Docker/WSL, so that
#     gate would assert a Windows-native-checkout constraint this repository
#     does not have.
#   * a release job.  Nothing in DEPS points a downstream repository at a
#     GitHub release of this one -- commodore-900-dist consumes what
#     `publish' stamps in a sibling checkout (hostbuild/publish-userland.sh,
#     RELEASE-STYLES.md sec. H.4), not a tagged archive -- so there is no
#     asset for a release workflow here to cut.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  userland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: userland, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: kdedon/commodore-900-coh-kernel3
          path: commodore-900-coh-kernel3
          token: ${{ secrets.C900_CI_TOKEN || github.token }}

      # A RELEASE of the toolchain, pinned in DEPS -- see DEPS's own comment
      # for why a tagged release and not a floating checkout.
      - name: The toolchain this tree is built with
        working-directory: userland
        run: |
          sh mk/deps-fetch.sh toolchain
          # Which SHAPE resolved, in the log: a release and a checkout are
          # both usable and a build should say which it got.
          sh mk/deps.sh -k toolchain

      - name: Userland sweep
        working-directory: userland
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/userland/deps/commodore-900-toolchain
          C900_KERNEL: ${{ github.workspace }}/commodore-900-coh-kernel3
        run: make -C hostbuild userland

      # Not for the dist repository here -- there is no image to pack in this
      # job -- but for the same reason kernel3 checks its own build: `all'
      # exiting 0 and `publish' having actually run against a fresh build are
      # different claims, and only the second is what a downstream checkout
      # depends on.
      - name: Publish stamp is fresh
        working-directory: userland
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/userland/deps/commodore-900-toolchain
          C900_KERNEL: ${{ github.workspace }}/commodore-900-coh-kernel3
        run: |
          make -C hostbuild publish
          make -C hostbuild check-publish-fresh
