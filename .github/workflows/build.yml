# build -- compile this repository's programs against the toolchain it pins.
#
# Modeled on commodore-900-coh-kernel3's build.yml: resolve the toolchain as a
# dependency edge (`make deps DEP=toolchain`), read back which shape resolved
# (`sh mk/deps.sh -k toolchain`), and point C900_TOOLCHAIN at the resolved
# deps/ path rather than checking the toolchain repository out separately.
#
# This repository builds programs; it does not link a kernel and does not pack
# an image (those are commodore-900-coh-kernel3 and commodore-900-coh-dist).
# The gate here is `make userland' -- the cmd/games/libs sweep hostbuild/
# Makefile's own header calls "the full ... sweep" -- followed by `publish' and
# `check-publish-fresh', so a green run proves the same thing a human running
# `make all' by hand would check: that the sweep finished AND that publish ran
# after it, not against a stale build/.ulstamp.
#
# NOT included, on purpose:
#   * tests/check-paths.sh.  Only the toolchain repository is checked out
#     natively on Windows; this repository builds under Docker/WSL, so that
#     gate would assert a Windows-native-checkout constraint this repository
#     does not have.
#   * a release job.  Nothing in DEPS points a downstream repository at a
#     GitHub release of this one -- commodore-900-coh-dist consumes what
#     `publish' stamps in a sibling checkout (hostbuild/publish-userland.sh,
#     RELEASE-STYLES.md sec. H.4), not a tagged archive -- so there is no
#     asset for a release workflow here to cut.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  userland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: userland, fetch-depth: 0 }

      # A RELEASE of the toolchain, pinned in DEPS -- see DEPS's own comment
      # for why a tagged release and not a floating checkout.
      - name: The toolchain this tree is built with
        working-directory: userland
        run: |
          make deps DEP=toolchain
          # Which SHAPE resolved, in the log: a release and a checkout are
          # both usable and a build should say which it got.
          sh mk/deps.sh -k toolchain

      - name: Userland sweep
        working-directory: userland
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/userland/deps/commodore-900-toolchain
        run: make -C hostbuild userland

      # Not for the dist repository here -- there is no image to pack in this
      # job -- but for the same reason kernel3 checks its own build: `all'
      # exiting 0 and `publish' having actually run against a fresh build are
      # different claims, and only the second is what a downstream checkout
      # depends on.
      - name: Publish stamp is fresh
        working-directory: userland
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/userland/deps/commodore-900-toolchain
        run: |
          make -C hostbuild publish
          make -C hostbuild check-publish-fresh

  # The DEFAULT flavour.  `make -C hostbuild userland' above builds
  # with COMPILER=mwc, the toolchain's own compiler; hr/Makefile's
  # default is mwc1985, the original June 1985 passes running as guest
  # processes, and nothing here exercised that until this job.  Where that
  # flavour goes wrong is header resolution -- a guest tool resolves <name.h>
  # against the GUEST's /usr/include, which with no guest root named is the
  # runner's own -- so the check is about WHICH headers were read, not only
  # about a zero exit.  mk/mwc1985/check.sh states the four claims and how
  # each one is proved.
  #
  # A CHECKOUT of the toolchain, where the job above takes a release: the 1985
  # compiler lives in the toolchain's vendor/mwc-1985, vendor/ is in no
  # archive, and a release therefore cannot answer for this flavour.
  mwc1985:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: userland, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with:
          repository: kdedon/commodore-900-toolchain
          path: commodore-900-toolchain

      - name: The emulator, which runs the 1985 compiler
        working-directory: userland
        run: make deps DEP=emu

      # <sys/clist.h> is staged across the `kernel' edge, and `make headers' --
      # which check-mwc1985 waits on, the guest root being a link onto the
      # staged /usr/include -- names it.
      - name: The kernel header edge
        working-directory: userland
        run: make deps DEP=kernel

      - name: Which compiler resolved
        working-directory: userland
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/commodore-900-toolchain
        run: make -C hr compiler-info

      - name: The default flavour reads the target's headers
        working-directory: userland
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/commodore-900-toolchain
        run: make check-mwc1985
