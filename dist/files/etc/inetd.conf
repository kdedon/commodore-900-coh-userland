# inetd.conf -- the switchboard's service table.  Read by /etc/inetd(8).
#
#	service  socktype  protocol  wait/nowait  user  program  [argv0 args]
#
# `service' is a name in /etc/services, or a port number written out.
# `program' is an absolute path, or the word `internal' for a service inetd
# answers itself.  The field after the path becomes the program's argv[0], as
# it does on BSD.
#
# TWO SHAPES ARE SERVED HERE, and a line asking for anything else is reported and
# skipped -- not silently ignored:
#
#	stream tcp nowait	a connection per caller, any program
#	dgram  udp  wait	one socket held for its whole life, and
#				`internal' only
#
# The second is internal-only because what a `wait' service is given is the
# LISTENING socket, and a descriptor cannot be handed to an exec'd program here
# (see below).  ntalk is the one such service, and inetd answers it itself.
#
# EVERY ENABLED LINE COSTS A CONNECTION FOR AS LONG AS THE MACHINE IS UP.  A
# listening port here is an open channel to /etc/inet exactly as a standalone
# daemon's would be, so a super-server saves memory and process slots and saves
# no connections at all.  The stack carries fifteen (it prints the number at
# boot: "inet: ready, NN connections") and /etc/rc.net spends one on slip.  The
# lines enabled below take it to eight where a mail transport is installed and
# seven where it is not -- one per port, telnet and ntalk included -- which leaves
# seven or eight for everything a user starts.
#
# inetd's OWN limit is tighter and separate: a socket costs it two of its NUFILE
# descriptors, and accepting on one needs THREE more free while it runs -- a
# replacement listening channel is opened before the connection is handed over,
# and that takes a request FIFO, a reply FIFO and the daemon's rendezvous, after
# which the connection is moved to a descriptor of its own.  So the ceiling is
# 2 * enabled lines + 3 + 3 <= NUFILE, which on a system whose <sys/param.h>
# says twenty is seven services exactly, with nothing else held and the
# switchboard not keeping its log open between messages.  A line past that
# ceiling is reported and skipped, and a line whose PROGRAM is not installed is
# reported and skipped BEFORE the count, so it costs no slot.  This file has
# seven enabled lines on a machine with a mail transport, which is that ceiling
# exactly: another service means a deeper per-process table, and net/inetd.c's
# MAXSERV is that arithmetic over NUFILE rather than a number to raise by hand.
#
# A CONNECTION TO AN EXTERNAL SERVICE COSTS TWO PROCESSES, not one.  A
# connection here is a pair of FIFOs plus framing state inside the process that
# holds it, and none of that survives exec(2) -- so inetd cannot hand the socket
# to the program the way BSD does.  It runs the program on a pipe instead and
# relays.
#
# SO EVERY PROGRAM LISTED HERE READS THE CONNECTION ON ITS STANDARD INPUT AND
# ANSWERS ON ITS STANDARD OUTPUT, one connection, then exits.
#
# AND EXITS IS PART OF THE CONTRACT, not a courtesy.  When the caller goes away
# the relay closes the program's standard input, so a zero-length read there is
# how a service is told its connection is gone -- and a service that reads on
# past it, or waits on something else, is one process left behind per dropped
# connection, which a 16-bit process table cannot absorb.  A program served from
# here must end its session on end of file, and must leave nothing of its own
# running when it does: telnetd hangs up the login it forked rather than
# trusting the pty's carrier to do it, because a connection dropped in the
# instant it was accepted leaves that child asleep in an open() on a line whose
# carrier has already gone.  ntalk is the one service here that outlives what
# started it, for the reason given against its line.  It cannot ask the
# descriptor who is at the other end -- getpeername(0) and
# ioctl(0, NWIOGTCPCONF) both fail on a pipe -- so inetd puts both ends of the
# connection in the environment as INETD_LOCADDR, INETD_LOCPORT, INETD_REMADDR
# and INETD_REMPORT, and their PRESENCE is how a program tells it was started
# here rather than from a shell.  telnetd, fingerd, remshd and smtpd all read
# them: ONE binary each, standalone when the variables are absent and an inetd
# service when they are present.
#
# ITS STANDARD ERROR IS NOT THE CONNECTION.  On BSD it would be -- there both 1
# and 2 are the socket -- and over the relay it would be the same pipe as the
# answers, so a service reporting that it cannot start would deliver its
# complaint to the caller as protocol and to nobody who could act on it.  So the
# relay gives a service a THIRD pipe for standard error and files each line with
# syslog(3) under the service's name: /etc/syslog.conf says where daemon.err
# lands, and that is where to look when a service answers nothing.
#
# A PROGRAM THAT BUFFERS ITS OUTPUT CANNOT BE SERVED HERE.  On a socket a reply
# written into stdio still reaches the peer when the program exits; over a relay
# so does it, but not until then -- so anything conversational must write(2) its
# answers, or fflush after each.  The four daemons above are all line-at-a-time
# and none of them puts the connection through stdio.
#
# The internal services need no port of their own and no other program
# installed, which is what makes them the ones that ship enabled alongside.

# echo (7) -- send back whatever arrives.  The reachability check that needs
# nothing at the other end but a client: /bin/echoclient (testing.list) speaks
# exactly this, and so does every other machine's telnet.
echo		stream	tcp	nowait	root	internal

# daytime (13) -- the date, in the local ctime(3) spelling, then CRLF, then the
# connection closes.  Readable by a person over telnet, which is what makes it
# the service to try first from another machine.
daytime		stream	tcp	nowait	root	internal

# The other two internals, both off by default.
#
# discard (9) throws away everything it is sent; it is a sink for a throughput
# measurement and answers nothing, so a person cannot tell it from a broken
# service.
#
# chargen (19) sends printable ASCII as fast as the peer will take it, for ever.
# On a 6 MHz machine sharing one stack with every other connection that is a
# load generator, not a diagnostic -- enable it deliberately or not at all.
#discard	stream	tcp	nowait	root	internal
#chargen	stream	tcp	nowait	root	internal

# time (37) -- four bytes, seconds since 1900, most significant first.  Off
# because this machine has no battery clock: read_cmos() returns 0 and the RTC
# has no driver, so until /etc/sntp has run the answer is 1900 stated with
# confidence.  Enable it on a machine whose clock is disciplined.
#time		stream	tcp	nowait	root	internal

# THE MACHINE'S OWN SERVERS.  /etc/rc.net starts none of these; each is served
# from here, and running one both ways at once is the mistake to avoid -- the
# second passive open on the port is refused and the port answers whichever got
# there first.
#
# telnet (23) -- a login.  It takes a pty as well as a connection, and there are
# eight ptys shared with the window systems, so the ceiling on simultaneous
# logins is inetd's child limit (-m, 4 by default) or the free ptys, whichever
# runs out first.  One connection is held for the port and as many logins are
# served as those two allow.
#
# There is no check for a pty node before the service is offered: on a machine
# with no ptys the port answers and telnetd tells the caller "there is no free
# PTY" and why, which is worth more than a service that does not exist and says
# nothing.
telnet		stream	tcp	nowait	root	/etc/telnetd	telnetd

# finger (79) -- one query, answered by running finger(1) on a pipe, then the
# connection closes.  The shortest-lived service here, and the clearest case for
# not keeping a daemon resident for it.
finger		stream	tcp	nowait	root	/etc/fingerd	fingerd

# shell (514) -- remsh(1)'s server, one command per connection.  It authenticates
# on the CALLER'S ADDRESS and on the caller's port being a reserved one, and it
# reads both out of INETD_REMADDR and INETD_REMPORT because a pipe cannot be
# asked.  If either is missing it refuses the session rather than serving it
# with an address of zero, which a wildcard .rhosts would match.  Note what that
# means for the trust model: the switchboard is now the thing that reports who
# called, so a program that could set INETD_REMADDR in inetd's environment could
# lie to remshd -- only root can, and root needs no help from remshd.
shell		stream	tcp	nowait	root	/etc/remshd	remshd

# smtp (25) -- mail in, and the line is conditional without being commented.
# /etc/smtpd comes from lists/mail-light.list and this file from lists/net.list,
# so on a machine with no mail transport the program named here is not installed
# -- and inetd skips a service whose program it cannot execute, with a line
# saying so, rather than binding the port (net/inetd.c loadconf).  The dist list
# that installs the daemon is therefore what turns the service on.
#
# One holder of port 25, never two: a site that wants smtpd standalone comments
# this line out and starts the daemon from rc.net, because with both the port
# answers whichever got there first.
smtp		stream	tcp	nowait	root	/etc/smtpd	smtpd

# ntalk (518/udp) -- the rendezvous half of talk(1), and the one INTERNAL service
# that is a daemon rather than a canned answer.  It used to be /etc/talkd,
# resident from rc.net; it is now inetd's own code (net/talkserv.c), and what
# that saves is the whole of a standing daemon between calls.
#
# `dgram udp wait', which means something different from every other line here:
# on the first datagram inetd forks a child WITHOUT exec -- the only way a socket
# can change process on this system, since exec throws libsocket's framing state
# away -- and hands it the socket for good.  That child holds the invitation
# table, which is state BETWEEN datagrams (one party leaves an invitation and the
# other looks it up seconds later), and it retires once it holds no invitation
# and has been idle; inetd then binds a fresh socket.  So the state lives exactly
# as long as the protocol can ask about it and no longer.
#
# THIS IS THE ONE SERVICE HERE THAT IS MEANT TO OUTLIVE WHAT STARTED IT, and it
# is a different question rather than an exception to the rule above: a datagram
# service has no connection to drop, so nothing a caller does can tell this child
# to go.  What bounds it is its own idle timer and nothing else.
#
# Root is required, and not for the port: 518 is not privileged here.  It is
# because announcing a call means writing on another user's terminal.  Enabled,
# because /bin/talk cannot complete a call in either direction without this
# service at BOTH ends and there is now nothing else to install for it.
ntalk		dgram	udp	wait	root	internal

# NOT SERVABLE HERE AT ALL: huntd.  hunt(6) is a multi-party game whose server
# holds every player's connection at once and polls them together, so it wants
# `stream tcp wait' -- the LISTENING DESCRIPTOR itself, handed to a program that
# must be exec'd, which is the one thing that cannot be done here.  Its UDP probe
# would be servable now that a datagram service exists; the listener is not.  So
# this is not a missing feature of inetd but a consequence of a connection not
# surviving exec(2).  /usr/games/lib/huntd keeps its own listeners and is started
# by the client that finds no game running.

# An EXTERNAL service of the simplest possible shape, for the test suite: the
# program reads the connection on its standard input and writes the answer on
# its standard output; inetd relays.  Left commented because /bin/cat as a
# network service is an open door -- it is here as the shape of the line, and as
# the thing os/tests/inetd exercises to prove the exec path.
#7777		stream	tcp	nowait	root	/bin/cat	cat
