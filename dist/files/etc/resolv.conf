#
# resolv.conf -- the DNS resolver's configuration (net/resolv/res_init.c).
#
# Lines understood: `domain NAME', `search NAME...' and `nameserver A.B.C.D'.
# Anything else on a line is ignored, so comments are safe here -- unlike
# /etc/rc and /etc/rc.net, whose shell has no comment character at all.
#
# THE FILE'S EXISTENCE IS THE SWITCH.  netdb.c's gethostbyname() tries a dotted
# quad, then /etc/hosts, and asks the network only when this file is present
# (have_resolv(), an access(2) call).  Without it a name that /etc/hosts does
# not know is HOST_NOT_FOUND at once; with it, that name costs a query and, if
# nothing answers, the resolver's full retry schedule -- four rounds with a
# doubling timeout, about a minute, which reads as a hang.  Removing this file
# is therefore the way to turn DNS off, and the right thing to do on a machine
# whose serial line is not connected to anything.
#
# The nameserver is the far end of the SLIP link.  rc.net gives this machine
# IFADDR=10.0.0.2 on a 255.255.255.0 net and the peer is 10.0.0.1 -- the only
# other host this machine can reach at all, so it is the only address a
# nameserver can usefully have.  Change it together with IFADDR in rc.net and
# the entries in /etc/hosts.
#
# The queries go out as UDP datagrams to port 53, with a retry over TCP if an
# answer comes back truncated (net/resolv/res_send.c).
#
# `domain' is the suffix appended to a name that has no dot in it, so `host foo'
# asks for foo.localnet.  It matches the name in /etc/hostname: with no domain
# line here res_init() would take everything after the first dot of
# gethostname() instead, which is the same answer by a longer road.
#
domain		localnet
nameserver	10.0.0.1
