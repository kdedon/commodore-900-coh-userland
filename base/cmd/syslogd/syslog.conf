# /etc/syslog.conf -- where syslogd files what it is told.
#
# One rule per line: a selector, whitespace, and the file the record is
# appended to.  A selector is facility.level; a level names itself and every
# more urgent one, `*' stands for all facilities or all levels, `none' takes
# the facility back out again, several facilities are separated by commas and
# several selectors by semicolons.
#
# Facilities: kern user mail daemon auth syslog lpr news uucp cron local0-7.
# Levels, most urgent first: emerg alert crit err warning notice info debug.
#
# Only a FILE action is served.  There is no network to forward a record to
# and no wall(1) to write it on, so a line whose action is a host or a user
# list is skipped rather than half-honoured.  /dev/console is a file for this
# purpose and is written but never created.
#
# syslogd rereads this file on SIGHUP -- which is signal 1 here, as everywhere,
# but note that SIGTERM on this system is 5 and not 15.
#
# A file that cannot be read, or that selects nothing, is not an empty
# configuration: syslogd falls back to sending everything to /usr/adm/syslog,
# because a machine whose log silently vanished over a typo is worse off than
# one that over-files.

# Everything of note, in one place.
*.info						/usr/adm/syslog

# Mail keeps its own, since a mail transport is chatty enough to bury
# everything else.  It is still in the file above at info and worse.
mail.debug					/usr/adm/maillog

# Logins, su and anything else authorising a user.
auth.info					/usr/adm/authlog

# What the machine cannot afford to have nobody see.
*.emerg						/dev/console
